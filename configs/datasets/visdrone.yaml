# VisDrone2019-DET Dataset Configuration for YOLO
# Source: https://github.com/VisDrone/VisDrone-Dataset
# Benchmark: AISKYEYE Team, Lab of Machine Learning and Data Mining, Tianjin University

# Dataset root directory (relative to project root or absolute if configured externally)
path: data/datasets/processed/visdrone

# Splits (relative to 'path')
train: images/train
val: images/val
test: images/test

# Number of classes
nc: 10

# Class names (official VisDrone taxonomy mapped to 0-indexed integers)
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
